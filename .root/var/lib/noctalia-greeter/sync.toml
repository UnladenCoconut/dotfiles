# noctalia-greeter sync.toml (UI + Sync; not managed by Nix)
# [session] last, [session.power] suspend/reboot/shutdown, [[session.actions]] action/command/label/glyph
# [appearance] scheme, theme_mode, corner_radius_scale, font_family
# [appearance.palette] full color role table, [appearance.wallpaper]/[appearance.wallpapers.<connector>]
# [output] layout/transforms/scales

[appearance]
corner_radius_scale = 1.0
font_family = "JetBrainsMono NF"
scheme = "Synced"
theme_mode = "dark"

    [appearance.palette]
    error = "#EC8A92"
    hover = "#F4D86A"
    on_error = "#2A1B21"
    on_hover = "#2A1B21"
    on_primary = "#2A1B21"
    on_secondary = "#2A1B21"
    on_surface = "#F3C7D7"
    on_surface_variant = "#EFDCE8"
    on_tertiary = "#2A1B21"
    outline = "#69383F"
    primary = "#F2C1D4"
    secondary = "#FFD6E2"
    shadow = "#4F3A47"
    surface = "#2A1922"
    surface_variant = "#4D3745"
    tertiary = "#D4A3BD"

    [appearance.wallpaper]
    fill_mode = "crop"
    path = "/var/lib/noctalia-greeter/wallpaper.jpg"

    [appearance.wallpapers.HDMI-A-1]
    fill_mode = "crop"
    path = "/var/lib/noctalia-greeter/wallpaper-HDMI-A-1.jpg"

    [appearance.wallpapers.eDP-1]
    fill_mode = "crop"
    path = "/var/lib/noctalia-greeter/wallpaper-eDP-1.jpg"

[output]
layout = "eDP-1:0,-277; HDMI-A-1:1920,-637"
scales = "HDMI-A-1:1.000; eDP-1:1.000"
transforms = "HDMI-A-1:normal; eDP-1:normal"

[session]
last = "Niri"